name: J078
options:
  bundleIdPrefix: com.example
  deploymentTarget:
    iOS: "16.0"
targets:
  J078:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: J078
    settings:
      base:
        PRODUCT_NAME: J078
        PRODUCT_BUNDLE_IDENTIFIER: com.example.j078app
        INFOPLIST_FILE: Support/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "4.0.0"
        CURRENT_PROJECT_VERSION: "4"
        ENABLE_BITCODE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - J078Tests
  # Logic tests: compile the pure protocol / safety / trip code directly (no host app),
  # so they run fast on any simulator and never touch Bluetooth.
  J078Tests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Tests
      - path: J078/Core
      - path: J078/ProtocolAdapters
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.j078tests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGNING_ALLOWED: NO
    scheme:
      testTargets:
        - J078Tests
